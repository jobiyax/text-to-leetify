<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Text to Leet</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Text to Leet</h1>
    <label>
      Direction :
      <select id="direction">
        <option value="to">Texte → leet</option>
        <option value="from">Leet → texte</option>
      </select>
    </label>
    <label>
      Niveau :
      <select id="level">
        <option value="0">1. Basique</option>
        <option value="1">2. Normal</option>
        <option value="2">3. Élevé</option>
      </select>
    </label>
    <br /><br />
    <label>
      Texte :
      <textarea id="input" rows="5" cols="40"></textarea>
    </label>
    <p id="output"></p>

    <script type="module" src="./script.ts"></script>
  </body>
</html>
