<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text to Leetif — Convertisseur Leet Speak 1337</title>
    <meta
      name="description"
      content="Convertis ton texte en Leet Speak 1337 et inversement en temps réel. Copie le résultat en un clic."
    />
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="../src/web/style.css" />
  </head>
  <body
    class="flex min-h-screen flex-col bg-zinc-50 font-mono text-zinc-900 transition-colors dark:bg-zinc-950 dark:text-zinc-100"
  >
    <header
      class="border-b border-zinc-300 bg-white dark:border-zinc-800 dark:bg-zinc-900"
    >
      <nav
        class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-3 px-4 py-3"
      >
        <img
          class="h-9 w-auto"
          src="text-to-leetif.webp"
          height="36"
          alt="Text to Leet"
        />
        <div class="flex items-center gap-3">
          <a
            class="flex items-center gap-2 rounded-none border border-zinc-300 px-3 py-1.5 text-sm text-zinc-900 hover:border-zinc-500 hover:bg-zinc-200 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:text-zinc-100 dark:hover:border-zinc-400 dark:hover:bg-zinc-800 dark:focus-visible:ring-zinc-400"
            href="https://github.com/jobiyax/text-to-leetify"
            target="_blank"
            rel="noopener noreferrer"
            title="Étoiles sur GitHub"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 256 256"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M208.31 75.68A59.78 59.78 0 0 0 202.93 28a8 8 0 0 0-6.93-4a59.75 59.75 0 0 0-48 24h-24a59.75 59.75 0 0 0-48-24a8 8 0 0 0-6.93 4a59.78 59.78 0 0 0-5.38 47.68A58.14 58.14 0 0 0 56 104v8a56.06 56.06 0 0 0 48.44 55.47A39.8 39.8 0 0 0 96 192v8H72a24 24 0 0 1-24-24a40 40 0 0 0-40-40a8 8 0 0 0 0 16a24 24 0 0 1 24 24a40 40 0 0 0 40 40h24v16a8 8 0 0 0 16 0v-40a24 24 0 0 1 48 0v40a8 8 0 0 0 16 0v-40a39.8 39.8 0 0 0-8.44-24.53A56.06 56.06 0 0 0 216 112v-8a58.14 58.14 0 0 0-7.69-28.32M200 112a40 40 0 0 1-40 40h-48a40 40 0 0 1-40-40v-8a41.74 41.74 0 0 1 6.9-22.48a8 8 0 0 0 1.1-7.69a43.8 43.8 0 0 1 .79-33.58a43.88 43.88 0 0 1 32.32 20.06a8 8 0 0 0 6.71 3.69h32.35a8 8 0 0 0 6.74-3.69a43.87 43.87 0 0 1 32.32-20.06a43.8 43.8 0 0 1 .77 33.58a8.09 8.09 0 0 0 1 7.65a41.7 41.7 0 0 1 7 22.52Z"
              />
            </svg>
            Star
            <span
              id="star-count"
              class="hidden border-l border-zinc-300 pl-2 dark:border-zinc-700"
            ></span>
          </a>
          <button
            id="theme"
            aria-label="Changer de thème"
            title="Changer de thème"
            class="flex cursor-pointer items-center justify-center rounded-none border border-zinc-300 p-2 hover:bg-zinc-200 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:hover:bg-zinc-800 dark:focus-visible:ring-zinc-400"
          >
            <svg
              id="icon-sun"
              class="h-5 w-5"
              viewBox="0 0 256 256"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M120 40V16a8 8 0 0 1 16 0v24a8 8 0 0 1-16 0m72 88a64 64 0 1 1-64-64a64.07 64.07 0 0 1 64 64m-16 0a48 48 0 1 0-48 48a48.05 48.05 0 0 0 48-48M58.34 69.66a8 8 0 0 0 11.32-11.32l-16-16a8 8 0 0 0-11.32 11.32Zm0 116.68l-16 16a8 8 0 0 0 11.32 11.32l16-16a8 8 0 0 0-11.32-11.32M192 72a8 8 0 0 0 5.66-2.34l16-16a8 8 0 0 0-11.32-11.32l-16 16A8 8 0 0 0 192 72m5.66 114.34a8 8 0 0 0-11.32 11.32l16 16a8 8 0 0 0 11.32-11.32ZM48 128a8 8 0 0 0-8-8H16a8 8 0 0 0 0 16h24a8 8 0 0 0 8-8m80 80a8 8 0 0 0-8 8v24a8 8 0 0 0 16 0v-24a8 8 0 0 0-8-8m112-88h-24a8 8 0 0 0 0 16h24a8 8 0 0 0 0-16"
              />
            </svg>
            <svg
              id="icon-moon"
              class="hidden h-5 w-5"
              viewBox="0 0 256 256"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M233.54 142.23a8 8 0 0 0-8-2a88.08 88.08 0 0 1-109.8-109.8a8 8 0 0 0-10-10a104.84 104.84 0 0 0-52.91 37A104 104 0 0 0 136 224a103.1 103.1 0 0 0 62.52-20.88a104.84 104.84 0 0 0 37-52.91a8 8 0 0 0-1.98-7.98m-44.64 48.11A88 88 0 0 1 65.66 67.11a89 89 0 0 1 31.4-26A106 106 0 0 0 96 56a104.11 104.11 0 0 0 104 104a106 106 0 0 0 14.92-1.06a89 89 0 0 1-26.02 31.4"
              />
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <main class="mx-auto flex w-full max-w-xl flex-1 flex-col gap-5 px-4 py-10">
      <p
        class="text-center text-sm leading-relaxed text-zinc-500 dark:text-zinc-400"
      >
        Convertis ton texte en Leet Speak 1337 et inversement en temps réel
      </p>

      <div class="flex flex-col gap-4 sm:flex-row sm:gap-6">
        <div
          class="flex flex-1 flex-col gap-1.5 text-sm text-zinc-600 dark:text-zinc-300"
        >
          Direction
          <details id="direction" data-value="to" class="group relative">
            <summary
              class="flex cursor-pointer list-none items-center justify-between gap-2 rounded-none border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:focus-visible:ring-zinc-400 [&::-webkit-details-marker]:hidden"
            >
              <span id="direction-label">Texte → leet</span>
              <svg
                class="h-4 w-4 transition-transform group-open:rotate-180"
                viewBox="0 0 256 256"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="m213.66 101.66-80 80a8 8 0 0 1-11.32 0l-80-80a8 8 0 0 1 11.32-11.32L128 164.69l74.34-74.35a8 8 0 0 1 11.32 11.32"
                />
              </svg>
            </summary>
            <div
              class="absolute z-10 mt-1 w-full rounded-none border border-zinc-300 bg-white shadow-lg dark:border-zinc-700 dark:bg-zinc-900"
            >
              <button
                type="button"
                data-value="to"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                Texte → leet
              </button>
              <button
                type="button"
                data-value="from"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                Leet → texte
              </button>
            </div>
          </details>
        </div>
        <div
          class="flex flex-1 flex-col gap-1.5 text-sm text-zinc-600 dark:text-zinc-300"
        >
          Niveau
          <details id="level" data-value="0" class="group relative">
            <summary
              class="flex cursor-pointer list-none items-center justify-between gap-2 rounded-none border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:focus-visible:ring-zinc-400 [&::-webkit-details-marker]:hidden"
            >
              <span id="level-label">1. Basique</span>
              <svg
                class="h-4 w-4 transition-transform group-open:rotate-180"
                viewBox="0 0 256 256"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="m213.66 101.66-80 80a8 8 0 0 1-11.32 0l-80-80a8 8 0 0 1 11.32-11.32L128 164.69l74.34-74.35a8 8 0 0 1 11.32 11.32"
                />
              </svg>
            </summary>
            <div
              class="absolute z-10 mt-1 w-full rounded-none border border-zinc-300 bg-white shadow-lg dark:border-zinc-700 dark:bg-zinc-900"
            >
              <button
                type="button"
                data-value="0"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                1. Basique
              </button>
              <button
                type="button"
                data-value="1"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                2. Normal
              </button>
              <button
                type="button"
                data-value="2"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                3. Élevé
              </button>
            </div>
          </details>
        </div>
      </div>

      <textarea
        id="input"
        rows="5"
        placeholder="Écris ton texte ici…"
        class="min-h-36 w-full resize-y rounded-none border border-zinc-300 bg-white px-3 py-2 text-zinc-900 placeholder-zinc-400 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder-zinc-500 dark:focus-visible:ring-zinc-400"
      ></textarea>

      <p
        id="output"
        class="min-h-12 w-full rounded-none border border-dashed border-zinc-400 px-3 py-3 leading-relaxed wrap-break-word dark:border-zinc-600"
      ></p>

      <button
        id="copy"
        class="w-full cursor-pointer rounded-none bg-zinc-900 px-4 py-2.5 text-white hover:bg-zinc-700 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none sm:w-auto sm:self-end dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-300 dark:focus-visible:ring-zinc-400"
      >
        Copier
      </button>
    </main>

    <footer
      class="border-t border-zinc-300 px-4 py-4 text-center text-xs text-zinc-500 dark:border-zinc-800 dark:text-zinc-400"
    >
      <p>&copy; <span id="year"></span> Text To Leetif</p>
    </footer>

    <script type="module" src="../src/web/main.ts"></script>
  </body>
</html>
