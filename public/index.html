<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applique le thème avant le premier paint pour éviter le flash clair
      (() => {
        const saved = localStorage.getItem("theme");
        const dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <title>Text to Leetify — Convertisseur Leet Speak 1337</title>
    <meta
      name="description"
      content="Convertis ton texte en Leet Speak 1337 et inversement en temps réel. Copie le résultat en un clic."
    />
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="../src/web/style.css" />
  </head>
  <body
    class="flex min-h-screen flex-col bg-zinc-50 font-mono text-zinc-900 transition-colors dark:bg-zinc-950 dark:text-zinc-100"
  >
    <header
      class="border-b border-zinc-300 bg-white dark:border-zinc-800 dark:bg-zinc-900"
    >
      <nav
        class="mx-auto flex max-w-xl flex-wrap items-center justify-between gap-3 px-4 py-3"
      >
        <h1 class="m-0 leading-none">
          <a href="." class="inline-block" aria-label="Recharger la page">
            <img
              class="h-9 w-auto"
              src="text-to-leetify.webp"
              height="36"
              alt="Text to Leetify"
            />
          </a>
        </h1>
        <div class="flex items-center gap-3">
          <a
            class="flex items-center gap-2 rounded-none border border-zinc-300 px-3 py-1.5 text-sm text-zinc-900 hover:border-zinc-500 hover:bg-zinc-200 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:text-zinc-100 dark:hover:border-zinc-400 dark:hover:bg-zinc-800 dark:focus-visible:ring-zinc-400"
            href="https://github.com/jobiyax/text-to-leetify"
            target="_blank"
            rel="noopener noreferrer"
            title="Étoiles sur GitHub"
          >
            <i class="ph ph-github-logo text-base" aria-hidden="true"></i>
            Star
            <span
              id="star-count"
              class="hidden border-l border-zinc-300 pl-2 dark:border-zinc-700"
            ></span>
          </a>
          <button
            id="theme"
            aria-label="Changer de thème"
            title="Changer de thème"
            class="flex cursor-pointer items-center justify-center rounded-none border border-zinc-300 p-2 hover:bg-zinc-200 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:hover:bg-zinc-800 dark:focus-visible:ring-zinc-400"
          >
            <i id="ph:sun" class="ph ph-sun text-xl" aria-hidden="true"></i>
            <i
              id="ph:moon"
              class="ph ph-moon hidden text-xl"
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </nav>
    </header>

    <main class="mx-auto flex w-full max-w-xl flex-1 flex-col gap-5 px-4 py-10">
      <p
        class="text-center text-sm leading-relaxed text-zinc-600 dark:text-zinc-400"
      >
        Convertis ton texte en Leet Speak 1337 et inversement en temps réel
      </p>

      <div class="flex flex-col gap-4 sm:flex-row sm:gap-6">
        <div
          role="group"
          aria-labelledby="direction-group-label"
          class="flex flex-1 flex-col gap-1.5 text-sm text-zinc-600 dark:text-zinc-300"
        >
          <span id="direction-group-label">Direction</span>
          <details id="direction" data-value="to" class="group relative">
            <summary
              class="flex cursor-pointer list-none items-center justify-between gap-2 rounded-none border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:focus-visible:ring-zinc-400 [&::-webkit-details-marker]:hidden"
            >
              <span id="direction-label">Texte vers leet</span>
              <i
                class="ph ph-caret-down inline-block text-sm transition-transform group-open:rotate-180"
                aria-hidden="true"
              ></i>
            </summary>
            <div
              class="absolute z-10 mt-1 w-full rounded-none border border-zinc-300 bg-white shadow-lg dark:border-zinc-700 dark:bg-zinc-900"
            >
              <button
                type="button"
                data-value="to"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                Texte vers leet
              </button>
              <button
                type="button"
                data-value="from"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                Leet vers texte
              </button>
            </div>
          </details>
        </div>
        <div
          role="group"
          aria-labelledby="level-group-label"
          class="flex flex-1 flex-col gap-1.5 text-sm text-zinc-600 dark:text-zinc-300"
        >
          <span id="level-group-label">Niveau</span>
          <details id="level" data-value="0" class="group relative">
            <summary
              class="flex cursor-pointer list-none items-center justify-between gap-2 rounded-none border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:focus-visible:ring-zinc-400 [&::-webkit-details-marker]:hidden"
            >
              <span id="level-label">1. Basique</span>
              <i
                class="ph ph-caret-down inline-block text-sm transition-transform group-open:rotate-180"
                aria-hidden="true"
              ></i>
            </summary>
            <div
              class="absolute z-10 mt-1 w-full rounded-none border border-zinc-300 bg-white shadow-lg dark:border-zinc-700 dark:bg-zinc-900"
            >
              <button
                type="button"
                data-value="0"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                1. Basique
              </button>
              <button
                type="button"
                data-value="1"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                2. Normal
              </button>
              <button
                type="button"
                data-value="2"
                class="w-full px-3 py-2 text-left text-sm text-zinc-900 hover:bg-zinc-200 dark:text-zinc-100 dark:hover:bg-zinc-800"
              >
                3. Élevé
              </button>
            </div>
          </details>
        </div>
      </div>

      <textarea
        id="input"
        rows="5"
        aria-label="Texte à convertir"
        placeholder="Écris ton texte ici…"
        class="min-h-36 w-full resize-y rounded-none border border-zinc-300 bg-white px-3 py-2 text-zinc-900 placeholder-zinc-500 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:focus-visible:ring-zinc-400"
      ></textarea>

      <p
        id="output"
        role="status"
        aria-label="Résultat de la conversion"
        class="min-h-12 w-full rounded-none border border-dashed border-zinc-400 px-3 py-3 leading-relaxed wrap-break-word dark:border-zinc-600"
      ></p>

      <button
        id="copy"
        class="w-full cursor-pointer rounded-none bg-zinc-900 px-4 py-2.5 text-white hover:bg-zinc-700 focus-visible:ring-2 focus-visible:ring-zinc-500 focus-visible:outline-none sm:w-auto sm:self-end dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-300 dark:focus-visible:ring-zinc-400"
      >
        Copier
      </button>
      <span id="announce" class="sr-only" aria-live="polite"></span>
    </main>

    <footer
      class="border-t border-zinc-300 px-4 py-4 text-center text-xs text-zinc-500 dark:border-zinc-800 dark:text-zinc-400"
    >
      <p>&copy; <span id="year"></span> Text to Leetify</p>
    </footer>

    <script type="module" src="../src/web/main.ts"></script>
  </body>
</html>
